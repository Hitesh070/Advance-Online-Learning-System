<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login System</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <!-- Login Form -->
            <div class="login-form" id="login-form">
                <h1>Student Login</h1>
                <div class="form-header">
                    <p>Welcome back! Please login to access your student portal</p>
                </div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="login-email">Gmail ID</label>
                        <input type="email" id="login-email" name="email" placeholder="example@gmail.com" required>
                        <span class="error" id="login-email-error"></span>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" name="password" placeholder="Enter your password" required>
                        <span class="error" id="login-password-error"></span>
                    </div>
                    <div class="form-group remember-me">
                        <input type="checkbox" id="login-remember" name="remember">
                        <label for="login-remember">Remember me</label>
                    </div>
                    <div class="form-group">
                        <button type="submit" id="login-btn">Login</button>
                    </div>
                    <div class="form-links">
                        <a href="index.html">Don't have an account? Register</a>
                    </div>
                </form>
            </div>
            

        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="login_script.js"></script>
</body>
</html>
