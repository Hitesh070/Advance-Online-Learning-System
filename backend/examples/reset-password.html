<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaxhakal - Reset Password</title>
    <link rel="stylesheet" href="../../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .reset-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .form-group .error {
            color: #ff3333;
            font-size: 12px;
            margin-top: 5px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4a6cf7;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover {
            background-color: #3a5bd9;
        }
        .form-links {
            margin-top: 20px;
            text-align: center;
        }
        .form-links a {
            color: #4a6cf7;
            text-decoration: none;
        }
        .form-links a:hover {
            text-decoration: underline;
        }
        .alert {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
        }
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div id="alert" style="display: none;"></div>
        
        <h2>Reset Your Password</h2>
        <p>Please enter your new password below.</p>
        
        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your new password" required>
                <span class="error" id="password-error"></span>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm your new password" required>
                <span class="error" id="confirm-password-error"></span>
            </div>
            <div class="form-group">
                <button type="submit" id="reset-btn">Reset Password</button>
            </div>
            <div class="form-links">
                <a href="login.html">Back to Login</a>
            </div>
        </form>
    </div>
    
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const resetPasswordForm = document.getElementById('resetPasswordForm');
            const alertBox = document.getElementById('alert');
            
            // Get token from URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                showAlert('Invalid or missing reset token. Please request a new password reset link.', 'danger');
                document.getElementById('reset-btn').disabled = true;
                return;
            }
            
            // Show alert message
            function showAlert(message, type) {
                alertBox.className = `alert alert-${type}`;
                alertBox.textContent = message;
                alertBox.style.display = 'block';
                
                // Auto hide after 5 seconds for success messages
                if (type === 'success') {
                    setTimeout(() => {
                        alertBox.style.display = 'none';
                    }, 5000);
                }
            }
            
            // Reset password form submission
            resetPasswordForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Clear previous errors
                document.getElementById('password-error').textContent = '';
                document.getElementById('confirm-password-error').textContent = '';
                
                // Get form data
                const password = document.getElementById('password').value.trim();
                const confirmPassword = document.getElementById('confirm-password').value.trim();
                
                // Validate form data
                let isValid = true;
                
                if (!password) {
                    document.getElementById('password-error').textContent = 'Password is required';
                    isValid = false;
                } else if (password.length < 8) {
                    document.getElementById('password-error').textContent = 'Password must be at least 8 characters';
                    isValid = false;
                }
                
                if (!confirmPassword) {
                    document.getElementById('confirm-password-error').textContent = 'Please confirm your password';
                    isValid = false;
                } else if (password !== confirmPassword) {
                    document.getElementById('confirm-password-error').textContent = 'Passwords do not match';
                    isValid = false;
                }
                
                if (!isValid) return;
                
                try {
                    // Reset password
                    const response = await authService.resetPassword({
                        token: token,
                        password: password
                    });
                    
                    if (response.success) {
                        // Show success message
                        showAlert(response.message, 'success');
                        
                        // Disable form
                        document.getElementById('reset-btn').disabled = true;
                        
                        // Redirect to login after 3 seconds
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 3000);
                    } else {
                        // Show error message
                        showAlert(response.message, 'danger');
                        
                        // Display field errors if any
                        if (response.errors) {
                            if (response.errors.token) {
                                showAlert(response.errors.token, 'danger');
                            }
                            if (response.errors.password) {
                                document.getElementById('password-error').textContent = response.errors.password;
                            }
                        }
                    }
                } catch (error) {
                    showAlert('An error occurred. Please try again later.', 'danger');
                }
            });
        });
    </script>
</body>
</html>
