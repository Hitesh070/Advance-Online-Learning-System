<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaxhakal - Login</title>
    <link rel="stylesheet" href="../../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .auth-tab {
            padding: 10px 20px;
            cursor: pointer;
            font-weight: 500;
        }
        .auth-tab.active {
            border-bottom: 2px solid #4a6cf7;
            color: #4a6cf7;
        }
        .auth-form {
            display: none;
        }
        .auth-form.active {
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .form-group .error {
            color: #ff3333;
            font-size: 12px;
            margin-top: 5px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4a6cf7;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover {
            background-color: #3a5bd9;
        }
        .form-links {
            margin-top: 20px;
            text-align: center;
        }
        .form-links a {
            color: #4a6cf7;
            text-decoration: none;
        }
        .form-links a:hover {
            text-decoration: underline;
        }
        .alert {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
        }
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-tabs">
            <div class="auth-tab active" data-tab="login">Login</div>
            <div class="auth-tab" data-tab="register">Register</div>
        </div>
        
        <div id="alert" style="display: none;"></div>
        
        <!-- Login Form -->
        <div class="auth-form active" id="login-form">
            <h2>Welcome Back</h2>
            <p>Please login to access your account</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" placeholder="Enter your email" required>
                    <span class="error" id="login-email-error"></span>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" placeholder="Enter your password" required>
                    <span class="error" id="login-password-error"></span>
                </div>
                <div class="form-group">
                    <button type="submit" id="login-btn">Login</button>
                </div>
                <div class="form-links">
                    <a href="#" id="forgot-password-link">Forgot Password?</a>
                </div>
            </form>
        </div>
        
        <!-- Register Form -->
        <div class="auth-form" id="register-form">
            <h2>Create Account</h2>
            <p>Please fill in the form to create your account</p>
            <form id="registerForm">
                <div class="form-group">
                    <label for="register-fullname">Full Name</label>
                    <input type="text" id="register-fullname" name="fullname" placeholder="Enter your full name" required>
                    <span class="error" id="register-fullname-error"></span>
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" name="email" placeholder="Enter your email" required>
                    <span class="error" id="register-email-error"></span>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" name="password" placeholder="Enter your password" required>
                    <span class="error" id="register-password-error"></span>
                </div>
                <div class="form-group">
                    <button type="submit" id="register-btn">Register</button>
                </div>
            </form>
        </div>
        
        <!-- Forgot Password Form -->
        <div class="auth-form" id="forgot-password-form">
            <h2>Reset Password</h2>
            <p>Enter your email to receive a password reset link</p>
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="forgot-email">Email</label>
                    <input type="email" id="forgot-email" name="email" placeholder="Enter your email" required>
                    <span class="error" id="forgot-email-error"></span>
                </div>
                <div class="form-group">
                    <button type="submit" id="forgot-btn">Send Reset Link</button>
                </div>
                <div class="form-links">
                    <a href="#" id="back-to-login-link">Back to Login</a>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Tab switching
            const tabs = document.querySelectorAll('.auth-tab');
            const forms = document.querySelectorAll('.auth-form');
            const forgotPasswordLink = document.getElementById('forgot-password-link');
            const backToLoginLink = document.getElementById('back-to-login-link');
            const alertBox = document.getElementById('alert');
            
            // API base URL
            const apiBaseUrl = '../api';
            
            // Show alert message
            function showAlert(message, type) {
                alertBox.className = `alert alert-${type}`;
                alertBox.textContent = message;
                alertBox.style.display = 'block';
                
                // Auto hide after 5 seconds
                setTimeout(() => {
                    alertBox.style.display = 'none';
                }, 5000);
            }
            
            // Switch tabs
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabId = tab.getAttribute('data-tab');
                    
                    // Update active tab
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    // Show corresponding form
                    forms.forEach(form => {
                        form.classList.remove('active');
                        if (form.id === `${tabId}-form`) {
                            form.classList.add('active');
                        }
                    });
                    
                    // Clear alert
                    alertBox.style.display = 'none';
                });
            });
            
            // Show forgot password form
            forgotPasswordLink.addEventListener('click', (e) => {
                e.preventDefault();
                forms.forEach(form => form.classList.remove('active'));
                document.getElementById('forgot-password-form').classList.add('active');
                alertBox.style.display = 'none';
            });
            
            // Back to login form
            backToLoginLink.addEventListener('click', (e) => {
                e.preventDefault();
                forms.forEach(form => form.classList.remove('active'));
                document.getElementById('login-form').classList.add('active');
                alertBox.style.display = 'none';
            });
            
            // Login form submission
            const loginForm = document.getElementById('loginForm');
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Clear previous errors
                document.getElementById('login-email-error').textContent = '';
                document.getElementById('login-password-error').textContent = '';
                
                // Get form data
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value.trim();
                
                // Validate form data
                let isValid = true;
                
                if (!email) {
                    document.getElementById('login-email-error').textContent = 'Email is required';
                    isValid = false;
                }
                
                if (!password) {
                    document.getElementById('login-password-error').textContent = 'Password is required';
                    isValid = false;
                }
                
                if (!isValid) return;
                
                try {
                    // Send login request
                    const response = await fetch(`${apiBaseUrl}/auth.php?action=login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        // Store token in local storage
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        
                        // Show success message
                        showAlert(data.message, 'success');
                        
                        // Redirect to dashboard
                        setTimeout(() => {
                            window.location.href = data.redirect || '../../dashboard.php';
                        }, 1000);
                    } else {
                        // Show error message
                        showAlert(data.message, 'danger');
                        
                        // Display field errors if any
                        if (data.errors) {
                            if (data.errors.email) {
                                document.getElementById('login-email-error').textContent = data.errors.email;
                            }
                            if (data.errors.password) {
                                document.getElementById('login-password-error').textContent = data.errors.password;
                            }
                        }
                    }
                } catch (error) {
                    showAlert('An error occurred. Please try again later.', 'danger');
                }
            });
            
            // Register form submission
            const registerForm = document.getElementById('registerForm');
            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Clear previous errors
                document.getElementById('register-fullname-error').textContent = '';
                document.getElementById('register-email-error').textContent = '';
                document.getElementById('register-password-error').textContent = '';
                
                // Get form data
                const fullname = document.getElementById('register-fullname').value.trim();
                const email = document.getElementById('register-email').value.trim();
                const password = document.getElementById('register-password').value.trim();
                
                // Validate form data
                let isValid = true;
                
                if (!fullname) {
                    document.getElementById('register-fullname-error').textContent = 'Full name is required';
                    isValid = false;
                }
                
                if (!email) {
                    document.getElementById('register-email-error').textContent = 'Email is required';
                    isValid = false;
                }
                
                if (!password) {
                    document.getElementById('register-password-error').textContent = 'Password is required';
                    isValid = false;
                } else if (password.length < 8) {
                    document.getElementById('register-password-error').textContent = 'Password must be at least 8 characters';
                    isValid = false;
                }
                
                if (!isValid) return;
                
                try {
                    // Send register request
                    const response = await fetch(`${apiBaseUrl}/auth.php?action=register`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ fullname, email, password })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        // Show success message
                        showAlert(data.message, 'success');
                        
                        // Switch to login form
                        setTimeout(() => {
                            tabs.forEach(t => t.classList.remove('active'));
                            document.querySelector('[data-tab="login"]').classList.add('active');
                            
                            forms.forEach(form => form.classList.remove('active'));
                            document.getElementById('login-form').classList.add('active');
                        }, 2000);
                    } else {
                        // Show error message
                        showAlert(data.message, 'danger');
                        
                        // Display field errors if any
                        if (data.errors) {
                            if (data.errors.fullname) {
                                document.getElementById('register-fullname-error').textContent = data.errors.fullname;
                            }
                            if (data.errors.email) {
                                document.getElementById('register-email-error').textContent = data.errors.email;
                            }
                            if (data.errors.password) {
                                document.getElementById('register-password-error').textContent = data.errors.password;
                            }
                        }
                    }
                } catch (error) {
                    showAlert('An error occurred. Please try again later.', 'danger');
                }
            });
            
            // Forgot password form submission
            const forgotPasswordForm = document.getElementById('forgotPasswordForm');
            forgotPasswordForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Clear previous errors
                document.getElementById('forgot-email-error').textContent = '';
                
                // Get form data
                const email = document.getElementById('forgot-email').value.trim();
                
                // Validate form data
                if (!email) {
                    document.getElementById('forgot-email-error').textContent = 'Email is required';
                    return;
                }
                
                try {
                    // Send forgot password request
                    const response = await fetch(`${apiBaseUrl}/auth.php?action=reset-password-request`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email })
                    });
                    
                    const data = await response.json();
                    
                    // Show success message (always show success for security)
                    showAlert(data.message, 'success');
                    
                    // Clear form
                    document.getElementById('forgot-email').value = '';
                } catch (error) {
                    showAlert('An error occurred. Please try again later.', 'danger');
                }
            });
        });
    </script>
</body>
</html>
