<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaxhakal - User Profile</title>
    <link rel="stylesheet" href="../../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #4a6cf7;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            margin-right: 20px;
        }
        .profile-info h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
        }
        .profile-info p {
            margin: 0;
            color: #666;
        }
        .profile-tabs {
            display: flex;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }
        .profile-tab {
            padding: 10px 20px;
            cursor: pointer;
            font-weight: 500;
        }
        .profile-tab.active {
            border-bottom: 2px solid #4a6cf7;
            color: #4a6cf7;
        }
        .profile-content {
            display: none;
        }
        .profile-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .form-group .error {
            color: #ff3333;
            font-size: 12px;
            margin-top: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #4a6cf7;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover {
            background-color: #3a5bd9;
        }
        .alert {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
        }
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
        }
        .role-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 500;
            margin-left: 10px;
        }
        .role-student {
            background-color: #e3f2fd;
            color: #0d47a1;
        }
        .role-teacher {
            background-color: #e8f5e9;
            color: #1b5e20;
        }
        .role-admin {
            background-color: #fce4ec;
            color: #880e4f;
        }
        .permission-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .permission-list li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .permission-list li:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div id="alert" style="display: none;"></div>
        
        <div class="profile-header">
            <div class="profile-avatar" id="avatar-initials">JS</div>
            <div class="profile-info">
                <h1 id="user-fullname">John Smith</h1>
                <p id="user-email">john.smith@example.com</p>
                <p>
                    <span id="user-role">Student</span>
                    <span class="role-badge role-student" id="role-badge">Student</span>
                </p>
            </div>
        </div>
        
        <div class="profile-tabs">
            <div class="profile-tab active" data-tab="profile">Profile</div>
            <div class="profile-tab" data-tab="security">Security</div>
            <div class="profile-tab" data-tab="permissions">Permissions</div>
        </div>
        
        <!-- Profile Tab -->
        <div class="profile-content active" id="profile-tab">
            <h2>Personal Information</h2>
            <form id="profileForm">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name">
                    <span class="error" id="fullname-error"></span>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" readonly>
                    <span class="error" id="email-error"></span>
                </div>
                <div class="form-group">
                    <button type="submit" id="update-profile-btn">Update Profile</button>
                </div>
            </form>
        </div>
        
        <!-- Security Tab -->
        <div class="profile-content" id="security-tab">
            <h2>Change Password</h2>
            <form id="passwordForm">
                <div class="form-group">
                    <label for="current-password">Current Password</label>
                    <input type="password" id="current-password" name="current_password" placeholder="Enter your current password">
                    <span class="error" id="current-password-error"></span>
                </div>
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" name="new_password" placeholder="Enter your new password">
                    <span class="error" id="new-password-error"></span>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm New Password</label>
                    <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm your new password">
                    <span class="error" id="confirm-password-error"></span>
                </div>
                <div class="form-group">
                    <button type="submit" id="update-password-btn">Update Password</button>
                </div>
            </form>
        </div>
        
        <!-- Permissions Tab -->
        <div class="profile-content" id="permissions-tab">
            <h2>Your Permissions</h2>
            <p>These are the permissions assigned to your account based on your role.</p>
            <ul class="permission-list" id="permission-list">
                <!-- Permissions will be populated here -->
            </ul>
        </div>
        
        <div style="margin-top: 30px; text-align: center;">
            <button id="logout-btn" style="background-color: #f44336;">Logout</button>
        </div>
    </div>
    
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is authenticated
            if (!authService.isAuthenticated()) {
                window.location.href = 'login.html';
                return;
            }
            
            // Get current user
            const user = authService.getCurrentUser();
            
            // Update profile information
            function updateProfileInfo() {
                // Set user information
                document.getElementById('user-fullname').textContent = user.fullname;
                document.getElementById('user-email').textContent = user.email;
                document.getElementById('user-role').textContent = user.role;
                
                // Set avatar initials
                const initials = user.fullname.split(' ')
                    .map(name => name.charAt(0))
                    .join('')
                    .substring(0, 2)
                    .toUpperCase();
                document.getElementById('avatar-initials').textContent = initials;
                
                // Set role badge
                const roleBadge = document.getElementById('role-badge');
                roleBadge.textContent = user.role;
                roleBadge.className = 'role-badge';
                
                if (user.role === 'Student') {
                    roleBadge.classList.add('role-student');
                } else if (user.role === 'Teacher') {
                    roleBadge.classList.add('role-teacher');
                } else if (user.role === 'Admin') {
                    roleBadge.classList.add('role-admin');
                }
                
                // Set form values
                document.getElementById('fullname').value = user.fullname;
                document.getElementById('email').value = user.email;
                
                // Populate permissions list
                const permissionList = document.getElementById('permission-list');
                permissionList.innerHTML = '';
                
                if (user.permissions && Array.isArray(user.permissions)) {
                    user.permissions.forEach(permission => {
                        const li = document.createElement('li');
                        li.textContent = permission;
                        permissionList.appendChild(li);
                    });
                } else {
                    const li = document.createElement('li');
                    li.textContent = 'No specific permissions found.';
                    permissionList.appendChild(li);
                }
            }
            
            // Initial profile update
            updateProfileInfo();
            
            // Refresh profile data from server
            authService.getProfile().then(response => {
                if (response.success) {
                    updateProfileInfo();
                }
            });
            
            // Tab switching
            const tabs = document.querySelectorAll('.profile-tab');
            const contents = document.querySelectorAll('.profile-content');
            const alertBox = document.getElementById('alert');
            
            // Show alert message
            function showAlert(message, type) {
                alertBox.className = `alert alert-${type}`;
                alertBox.textContent = message;
                alertBox.style.display = 'block';
                
                // Auto hide after 5 seconds
                setTimeout(() => {
                    alertBox.style.display = 'none';
                }, 5000);
            }
            
            // Switch tabs
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabId = tab.getAttribute('data-tab');
                    
                    // Update active tab
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    // Show corresponding content
                    contents.forEach(content => {
                        content.classList.remove('active');
                        if (content.id === `${tabId}-tab`) {
                            content.classList.add('active');
                        }
                    });
                    
                    // Clear alert
                    alertBox.style.display = 'none';
                });
            });
            
            // Profile form submission
            const profileForm = document.getElementById('profileForm');
            profileForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Clear previous errors
                document.getElementById('fullname-error').textContent = '';
                
                // Get form data
                const fullname = document.getElementById('fullname').value.trim();
                
                // Validate form data
                let isValid = true;
                
                if (!fullname) {
                    document.getElementById('fullname-error').textContent = 'Full name is required';
                    isValid = false;
                }
                
                if (!isValid) return;
                
                try {
                    // Update profile
                    const response = await authService.updateProfile({ fullname });
                    
                    if (response.success) {
                        // Show success message
                        showAlert(response.message, 'success');
                        
                        // Update profile information
                        updateProfileInfo();
                    } else {
                        // Show error message
                        showAlert(response.message, 'danger');
                        
                        // Display field errors if any
                        if (response.errors && response.errors.fullname) {
                            document.getElementById('fullname-error').textContent = response.errors.fullname;
                        }
                    }
                } catch (error) {
                    showAlert('An error occurred. Please try again later.', 'danger');
                }
            });
            
            // Password form submission
            const passwordForm = document.getElementById('passwordForm');
            passwordForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Clear previous errors
                document.getElementById('current-password-error').textContent = '';
                document.getElementById('new-password-error').textContent = '';
                document.getElementById('confirm-password-error').textContent = '';
                
                // Get form data
                const currentPassword = document.getElementById('current-password').value.trim();
                const newPassword = document.getElementById('new-password').value.trim();
                const confirmPassword = document.getElementById('confirm-password').value.trim();
                
                // Validate form data
                let isValid = true;
                
                if (!currentPassword) {
                    document.getElementById('current-password-error').textContent = 'Current password is required';
                    isValid = false;
                }
                
                if (!newPassword) {
                    document.getElementById('new-password-error').textContent = 'New password is required';
                    isValid = false;
                } else if (newPassword.length < 8) {
                    document.getElementById('new-password-error').textContent = 'Password must be at least 8 characters';
                    isValid = false;
                }
                
                if (!confirmPassword) {
                    document.getElementById('confirm-password-error').textContent = 'Please confirm your new password';
                    isValid = false;
                } else if (newPassword !== confirmPassword) {
                    document.getElementById('confirm-password-error').textContent = 'Passwords do not match';
                    isValid = false;
                }
                
                if (!isValid) return;
                
                try {
                    // Update password
                    const response = await authService.updateProfile({
                        current_password: currentPassword,
                        new_password: newPassword
                    });
                    
                    if (response.success) {
                        // Show success message
                        showAlert(response.message, 'success');
                        
                        // Clear form
                        passwordForm.reset();
                    } else {
                        // Show error message
                        showAlert(response.message, 'danger');
                        
                        // Display field errors if any
                        if (response.errors) {
                            if (response.errors.current_password) {
                                document.getElementById('current-password-error').textContent = response.errors.current_password;
                            }
                            if (response.errors.new_password) {
                                document.getElementById('new-password-error').textContent = response.errors.new_password;
                            }
                        }
                    }
                } catch (error) {
                    showAlert('An error occurred. Please try again later.', 'danger');
                }
            });
            
            // Logout button
            const logoutBtn = document.getElementById('logout-btn');
            logoutBtn.addEventListener('click', async () => {
                try {
                    await authService.logout();
                    window.location.href = 'login.html';
                } catch (error) {
                    showAlert('An error occurred during logout. Please try again.', 'danger');
                }
            });
        });
    </script>
</body>
</html>
